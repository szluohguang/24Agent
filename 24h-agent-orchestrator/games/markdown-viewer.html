<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 查看器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100dvh;
    display: flex;
  }
  .sidebar {
    width: 260px; flex-shrink: 0;
    background: #161b22; border-right: 1px solid #30363d;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid #30363d;
    font-size: 14px; font-weight: 600; color: #e6edf3;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-header .icon { font-size: 18px; }
  .file-list {
    flex: 1; overflow-y: auto; padding: 8px 0;
  }
  .file-item {
    padding: 8px 16px; cursor: pointer; font-size: 13px;
    color: #8b949e; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
    border-left: 3px solid transparent;
  }
  .file-item:hover { background: #1c2128; color: #c9d1d9; }
  .file-item.active { background: #1c2128; color: #e6edf3; border-left-color: #58a6ff; }
  .file-item .file-icon { font-size: 14px; flex-shrink: 0; }
  .file-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .toolbar {
    padding: 12px 20px; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; gap: 12px;
    background: #161b22; flex-shrink: 0;
  }
  .toolbar .title {
    font-size: 14px; font-weight: 600; color: #e6edf3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .btn {
    padding: 6px 14px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #c9d1d9; cursor: pointer;
    font-size: 12px; font-weight: 500; transition: all .15s;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #30363d; border-color: #8b949e; }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-drop {
    display: flex; align-items: center; gap: 4px;
  }
  .btn-drop::after {
    content: ''; display: inline-block;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 4px solid currentColor; margin-left: 2px;
  }
  .content {
    flex: 1; overflow-y: auto; padding: 24px 32px;
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 16px;
    color: #8b949e;
  }
  .empty-state .big-icon { font-size: 48px; opacity: 0.4; }
  .empty-state .text { font-size: 15px; }
  .empty-state .subtext { font-size: 12px; color: #484f58; }
  .drop-zone {
    border: 2px dashed #30363d; border-radius: 12px;
    padding: 48px; text-align: center; cursor: pointer;
    transition: all .2s; max-width: 400px; width: 100%;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #58a6ff; background: rgba(88,166,255,0.05);
  }
  .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
  .drop-zone .label { color: #8b949e; font-size: 14px; }
  .drop-zone .hint { color: #484f58; font-size: 12px; margin-top: 4px; }

  /* Markdown content styles */
  .content h1 { font-size: 28px; font-weight: 600; margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #30363d; color: #e6edf3; }
  .content h2 { font-size: 22px; font-weight: 600; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #21262d; color: #e6edf3; }
  .content h3 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; color: #e6edf3; }
  .content h4 { font-size: 16px; font-weight: 600; margin: 12px 0 8px; color: #e6edf3; }
  .content h5, .content h6 { font-size: 14px; font-weight: 600; margin: 10px 0 6px; color: #e6edf3; }
  .content p { margin: 0 0 12px; }
  .content a { color: #58a6ff; text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content strong { color: #e6edf3; font-weight: 600; }
  .content em { font-style: italic; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 24px; }
  .content li { margin: 4px 0; }
  .content li > p { margin: 0; }
  .content blockquote {
    margin: 0 0 12px; padding: 8px 16px;
    border-left: 4px solid #30363d; background: #161b22;
    border-radius: 0 6px 6px 0;
  }
  .content blockquote p:last-child { margin: 0; }
  .content hr { border: none; border-top: 1px solid #30363d; margin: 24px 0; }
  .content img { max-width: 100%; border-radius: 6px; margin: 8px 0; }
  .content table {
    border-collapse: collapse; margin: 0 0 12px; width: 100%;
    font-size: 13px;
  }
  .content th, .content td {
    padding: 8px 12px; border: 1px solid #30363d;
    text-align: left;
  }
  .content th { background: #161b22; font-weight: 600; color: #e6edf3; }
  .content tr:nth-child(even) td { background: #0d1117; }
  .content code {
    padding: 2px 6px; background: #161b22; border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.875em; color: #f0883e;
  }
  .content pre {
    margin: 0 0 16px; padding: 16px; border-radius: 8px;
    background: #161b22; border: 1px solid #30363d;
    overflow-x: auto; position: relative;
  }
  .content pre code {
    padding: 0; background: none; border-radius: 0;
    color: #c9d1d9; font-size: 13px; line-height: 1.5;
  }
  .content pre .copy-btn {
    position: absolute; top: 8px; right: 8px;
    padding: 4px 8px; border: 1px solid #30363d; border-radius: 4px;
    background: #21262d; color: #8b949e; cursor: pointer;
    font-size: 11px; opacity: 0; transition: opacity .15s;
  }
  .content pre:hover .copy-btn { opacity: 1; }
  .content pre .copy-btn:hover { background: #30363d; color: #c9d1d9; }
  .content .task-list { list-style: none; padding-left: 0; }
  .content .task-list li { display: flex; align-items: center; gap: 8px; }
  .content .task-list input[type="checkbox"] { margin: 0; }
  .content .footnote { color: #8b949e; font-size: 12px; }

  /* TOC */
  .toc { margin: 0 0 20px; padding: 12px 16px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; }
  .toc-title { font-size: 13px; font-weight: 600; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .toc a { display: block; font-size: 13px; padding: 3px 0; color: #58a6ff; text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  .toc .toc-h2 { padding-left: 16px; }
  .toc .toc-h3 { padding-left: 32px; }

  .loading { display: none; text-align: center; padding: 40px; color: #8b949e; }
  .loading.show { display: block; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .content { padding: 16px; }
    .content h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <span class="icon">📄</span> 打开的文件
  </div>
  <div class="file-list" id="fileList"></div>
</div>
<div class="main">
  <div class="toolbar">
    <span class="title" id="toolbarTitle">Markdown 查看器</span>
    <button class="btn" id="openFileBtn" title="打开 Markdown 文件">📂 打开文件</button>
    <div style="position:relative;display:inline-block">
      <button class="btn btn-drop" id="openDirBtn" title="打开文件夹">📁 打开文件夹</button>
    </div>
    <input type="file" id="fileInput" accept=".md,.markdown" style="display:none" multiple>
    <input type="file" id="dirInput" webkitdirectory style="display:none" multiple>
  </div>
  <div class="content" id="content">
    <div class="empty-state">
      <div class="big-icon">📝</div>
      <div class="text">打开一个 Markdown 文件开始查看</div>
      <div class="subtext">支持 .md / .markdown 格式</div>
      <div class="drop-zone" id="dropZone">
        <div class="icon">📥</div>
        <div class="label">拖拽文件到这里</div>
        <div class="hint">或点击上方工具栏打开</div>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const content = document.getElementById('content')
  const fileList = document.getElementById('fileList')
  const toolbarTitle = document.getElementById('toolbarTitle')
  const fileInput = document.getElementById('fileInput')
  const dirInput = document.getElementById('dirInput')
  const openFileBtn = document.getElementById('openFileBtn')
  const openDirBtn = document.getElementById('openDirBtn')
  const dropZone = document.getElementById('dropZone')

  let currentFiles = []
  let currentFileIndex = -1

  openFileBtn.addEventListener('click', () => fileInput.click())
  openDirBtn.addEventListener('click', () => dirInput.click())

  function addFileToList(name, content) {
    const idx = currentFiles.length
    currentFiles.push({ name, content })
    const div = document.createElement('div')
    div.className = 'file-item'
    div.dataset.index = idx
    div.innerHTML = `<span class="file-icon">📄</span><span class="name">${escapeHtml(name)}</span>`
    div.addEventListener('click', () => selectFile(idx))
    fileList.appendChild(div)
    if (currentFiles.length === 1) selectFile(0)
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  function selectFile(idx) {
    if (idx < 0 || idx >= currentFiles.length) return
    currentFileIndex = idx
    const file = currentFiles[idx]
    toolbarTitle.textContent = file.name

    document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'))
    const items = document.querySelectorAll('.file-item')
    if (items[idx]) items[idx].classList.add('active')

    renderMarkdown(file.content)
  }

  function renderMarkdown(md) {
    const html = parseMarkdown(md)
    content.innerHTML = html
    addCopyButtons()
    addHeadingAnchors()
    addToc()
  }

  function parseMarkdown(md) {
    if (!md) return '<div class="empty-state"><div class="text">空文件</div></div>'

    let lines = md.split('\n')
    let html = ''
    let i = 0

    const inlines = {
      code: (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>'),
      bold: (s) => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'),
      italic: (s) => s.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>'),
      link: (s) => s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, url) => `<a href="${escapeHtml(url)}" target="_blank">${t}</a>`),
      image: (s) => s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => `<img src="${escapeHtml(url)}" alt="${escapeHtml(alt)}" loading="lazy">`),
      del: (s) => s.replace(/~~(.+?)~~/g, '<del>$1</del>'),
    }

    function applyInline(s) {
      return inlines.image(inlines.link(inlines.code(inlines.del(inlines.bold(inlines.italic(s))))))
    }

    function processTable(lines, start) {
      const rows = []
      let idx = start
      while (idx < lines.length && lines[idx].trim().startsWith('|')) {
        rows.push(lines[idx].trim())
        idx++
      }
      if (rows.length < 2) return { html: '', end: start }

      const headers = rows[0].split('|').filter(s => s.trim()).map(s => s.trim())
      const aligns = rows[1].split('|').filter(s => s.trim()).map(s => {
        if (s.startsWith(':') && s.endsWith(':')) return 'center'
        if (s.endsWith(':')) return 'right'
        if (s.startsWith(':')) return 'left'
        return ''
      })

      let table = '<table>'
      table += '<thead><tr>' + headers.map((h, j) => `<th style="${aligns[j] ? 'text-align:' + aligns[j] : ''}">${applyInline(h)}</th>`).join('') + '</tr></thead>'
      table += '<tbody>'
      for (let r = 2; r < rows.length; r++) {
        const cells = rows[r].split('|').filter(s => s.trim()).map(s => s.trim())
        table += '<tr>' + cells.map((c, j) => `<td style="${aligns[j] ? 'text-align:' + aligns[j] : ''}">${applyInline(c)}</td>`).join('') + '</tr>'
      }
      table += '</tbody></table>'
      return { html: table + '\n', end: idx }
    }

    while (i < lines.length) {
      const line = lines[i]
      const trimmed = line.trim()

      // code block
      if (trimmed.startsWith('```')) {
        const lang = trimmed.slice(3).trim()
        let code = []
        i++
        while (i < lines.length && !lines[i].trim().startsWith('```')) {
          code.push(lines[i])
          i++
        }
        i++ // skip closing ```
        const codeHtml = escapeHtml(code.join('\n'))
        html += `<pre><code class="${lang ? 'language-' + escapeHtml(lang) : ''}">${codeHtml}</code></pre>\n`
        continue
      }

      // html block
      if (trimmed.startsWith('<') && trimmed.endsWith('>')) {
        html += line + '\n'
        i++
        continue
      }

      // hr
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(trimmed)) {
        html += '<hr>\n'; i++; continue
      }

      // heading
      const hm = trimmed.match(/^(#{1,6})\s+(.+)$/)
      if (hm) {
        const level = hm[1].length
        const text = applyInline(hm[2])
        const id = hm[2].toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/(^-|-$)/g, '')
        html += `<h${level} id="${id}">${text}</h${level}>\n`
        i++; continue
      }

      // table
      if (trimmed.startsWith('|') && i + 1 < lines.length && lines[i + 1].trim().startsWith('|') && /^[\s|:-]+$/.test(lines[i + 1].trim())) {
        const result = processTable(lines, i)
        html += result.html
        i = result.end
        continue
      }

      // blockquote
      if (trimmed.startsWith('>')) {
        let quotes = []
        while (i < lines.length && lines[i].trim().startsWith('>')) {
          quotes.push(lines[i].trim().replace(/^>\s?/, ''))
          i++
        }
        const quoteContent = applyInline(quotes.join('<br>'))
        html += `<blockquote><p>${quoteContent}</p></blockquote>\n`
        continue
      }

      // unordered list
      if (/^[\s]*[-*+]\s/.test(trimmed)) {
        html += '<ul>\n'
        while (i < lines.length && /^[\s]*[-*+]\s/.test(lines[i].trim())) {
          const text = lines[i].trim().replace(/^[-*+]\s+/, '')
          const taskMatch = text.match(/^\[([ xX])\]\s*(.+)/)
          if (taskMatch) {
            const checked = taskMatch[1].toLowerCase() === 'x'
            html += `<li class="task-list"><input type="checkbox" ${checked ? 'checked' : ''} disabled>${applyInline(taskMatch[2])}</li>\n`
          } else {
            html += `<li>${applyInline(text)}</li>\n`
          }
          i++
        }
        html += '</ul>\n'
        continue
      }

      // ordered list
      if (/^\s*\d+\.\s/.test(trimmed)) {
        html += '<ol>\n'
        while (i < lines.length && /^\s*\d+\.\s/.test(lines[i].trim())) {
          const text = lines[i].trim().replace(/^\d+\.\s+/, '')
          html += `<li>${applyInline(text)}</li>\n`
          i++
        }
        html += '</ol>\n'
        continue
      }

      // blank line
      if (trimmed === '') { i++; continue }

      // paragraph
      let para = []
      while (i < lines.length && lines[i].trim() !== '' && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```') && !lines[i].trim().startsWith('|') && !lines[i].trim().startsWith('>') && !/^[-*]\s/.test(lines[i].trim()) && !/^\d+\.\s/.test(lines[i].trim()) && !/^(-{3,}|\*{3,})$/.test(lines[i].trim())) {
        para.push(lines[i].trim())
        i++
      }
      if (para.length > 0) {
        html += `<p>${applyInline(para.join(' '))}</p>\n`
      } else {
        i++
      }
    }

    return html
  }

  function addCopyButtons() {
    document.querySelectorAll('.content pre').forEach(pre => {
      const btn = document.createElement('button')
      btn.className = 'copy-btn'
      btn.textContent = '📋 复制'
      btn.addEventListener('click', async () => {
        const code = pre.querySelector('code')
        if (!code) return
        try {
          await navigator.clipboard.writeText(code.textContent)
          btn.textContent = '✅ 已复制'
          setTimeout(() => { btn.textContent = '📋 复制' }, 2000)
        } catch { btn.textContent = '❌ 失败' }
      })
      pre.appendChild(btn)
    })
  }

  function addHeadingAnchors() {
    document.querySelectorAll('.content h1, .content h2, .content h3').forEach(h => {
      if (!h.id) {
        h.id = h.textContent.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/(^-|-$)/g, '')
      }
    })
  }

  function addToc() {
    const headings = content.querySelectorAll('h1, h2, h3')
    if (headings.length < 3) return
    let toc = '<div class="toc"><div class="toc-title">📑 目录</div>'
    headings.forEach(h => {
      const level = h.tagName.toLowerCase()
      const cls = level === 'h2' ? 'toc-h2' : level === 'h3' ? 'toc-h3' : ''
      toc += `<a href="#${h.id}" class="${cls}">${h.textContent}</a>`
    })
    toc += '</div>'
    content.insertAdjacentHTML('afterbegin', toc)
  }

  // File input handling
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files).filter(f => f.name.endsWith('.md') || f.name.endsWith('.markdown'))
    processFiles(files)
    fileInput.value = ''
  })

  dirInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files).filter(f => f.name.endsWith('.md') || f.name.endsWith('.markdown'))
    processFiles(files)
    dirInput.value = ''
  })

  function processFiles(files) {
    if (files.length === 0) return
    let loaded = 0
    files.forEach(file => {
      const reader = new FileReader()
      reader.onload = (e) => {
        addFileToList(file.name, e.target.result)
        loaded++
      }
      reader.readAsText(file)
    })
  }

  // Drag and drop
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault()
    dropZone.classList.add('dragover')
  })
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover')
  })
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault()
    dropZone.classList.remove('dragover')
    const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.md') || f.name.endsWith('.markdown'))
    processFiles(files)
  })

  // Global drag and drop
  document.addEventListener('dragover', (e) => e.preventDefault())
  document.addEventListener('drop', (e) => {
    e.preventDefault()
    const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.md') || f.name.endsWith('.markdown'))
    if (files.length > 0) processFiles(files)
  })
})()
</script>
</body>
</html>
