<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100dvh; background: #0a0a1a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: none; user-select: none;
    overflow: hidden;
  }
  .game-wrapper {
    background: #111128; border-radius: 24px; padding: 24px;
    box-shadow: 0 0 60px rgba(0, 200, 255, 0.08);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding: 0 4px;
  }
  .score-box {
    color: #8af; font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
  }
  .score-box span { color: #fff; font-size: 20px; }
  .best-score { color: #faa; }
  .best-score span { color: #faa; }
  .btn-restart {
    background: none; border: 1.5px solid #335; border-radius: 10px;
    color: #8af; padding: 8px 18px; cursor: pointer; font-size: 13px;
    font-weight: 600; transition: all .2s;
  }
  .btn-restart:hover { background: rgba(100,170,255,0.1); border-color: #8af; }
  canvas {
    display: block; border-radius: 12px; background: #0d0d24;
    width: 100%; height: auto; aspect-ratio: 1 / 1;
    max-width: 500px; max-height: 500px;
    touch-action: none;
  }
  .controls-hint {
    display: flex; justify-content: center; gap: 8px; margin-top: 14px;
    color: #446; font-size: 12px;
  }
  .controls-hint kbd {
    background: #1a1a35; border: 1px solid #335; border-radius: 6px;
    padding: 3px 8px; color: #8af; font-size: 11px;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 12px;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 12px;
    background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { color: #fff; font-size: 28px; letter-spacing: 1px; }
  .overlay .final-score { color: #8af; font-size: 16px; }
  .overlay .final-score span { color: #fff; font-size: 22px; font-weight: 700; }
  .overlay .btn-play {
    background: linear-gradient(135deg, #4af, #28d);
    border: none; border-radius: 12px; color: #fff; padding: 14px 40px;
    cursor: pointer; font-size: 16px; font-weight: 700;
    letter-spacing: 0.5px; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 20px rgba(68,170,255,0.3);
  }
  .overlay .btn-play:hover { transform: scale(1.04); box-shadow: 0 6px 28px rgba(68,170,255,0.45); }
  .canvas-wrap { position: relative; display: inline-block; }
  .pause-badge {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,200,50,0.15); border: 1px solid rgba(255,200,50,0.3);
    color: #fd4; padding: 4px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .pause-badge.show { opacity: 1; }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="score-box">分数 <span id="score">0</span></div>
    <div class="best-score">最高 <span id="bestScore">0</span></div>
    <button class="btn-restart" id="restartBtn">↻ 重来</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="pause-badge" id="pauseBadge">⏸ 已暂停</div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">🐍 贪吃蛇</h2>
      <div class="final-score" id="overlayScore"></div>
      <button class="btn-play" id="playBtn">开始游戏</button>
    </div>
  </div>
  <div class="controls-hint">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · <kbd>Space</kbd> 暂停
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestScoreEl = document.getElementById('bestScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const playBtn = document.getElementById('playBtn');
  const restartBtn = document.getElementById('restartBtn');
  const pauseBadge = document.getElementById('pauseBadge');

  const SIZE = 20;
  const CELL = canvas.width / SIZE;

  let snake, food, dir, nextDir, score, bestScore;
  let running = false, paused = false, gameOver = false;
  let gameLoop = null;
  let speed = 150;
  let touchStartX = 0, touchStartY = 0;

  function loadBest() {
    try { return parseInt(localStorage.getItem('snakeBest') || '0', 10); } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('snakeBest', String(v)); } catch {}
  }

  function randomFood() {
    const occupied = new Set(snake.map(c => `${c.x},${c.y}`));
    const free = [];
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (!occupied.has(`${x},${y}`)) free.push({ x, y });
    if (free.length === 0) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function init() {
    snake = [
      { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    bestScore = loadBest();
    speed = 150;
    gameOver = false;
    paused = false;
    pauseBadge.classList.remove('show');
    food = randomFood();
    updateScore();
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < SIZE; x++) {
      for (let y = 0; y < SIZE; y++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = '#0d0d24';
        } else {
          ctx.fillStyle = '#10102a';
        }
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    snake.forEach((seg, i) => {
      const t = 0.6 + 0.4 * (1 - i / snake.length);
      const r = Math.round(50 * t);
      const g = Math.round((180 + 40 * (1 - t)) * t);
      const b = Math.round((200 + 40 * (1 - t)) * t);
      ctx.fillStyle = i === 0 ? '#4af' : `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 2 : 3;
      const radius = 4;
      const x = seg.x * CELL + pad;
      const y = seg.y * CELL + pad;
      const w = CELL - pad * 2;
      const h = CELL - pad * 2;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();

      if (i === 0) {
        ctx.fillStyle = '#fff';
        const eyeOff = 4;
        ctx.beginPath();
        ctx.arc(seg.x * CELL + CELL * 0.35, seg.y * CELL + CELL * 0.35, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(seg.x * CELL + CELL * 0.65, seg.y * CELL + CELL * 0.35, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(seg.x * CELL + CELL * 0.35, seg.y * CELL + CELL * 0.35, 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(seg.x * CELL + CELL * 0.65, seg.y * CELL + CELL * 0.35, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    if (food) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const r = CELL * 0.35;
      const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 200);
      ctx.save();
      ctx.shadowColor = '#f44';
      ctx.shadowBlur = 12 * pulse;
      const grad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, r * pulse);
      grad.addColorStop(0, '#ff6666');
      grad.addColorStop(0.6, '#ee2222');
      grad.addColorStop(1, '#aa0000');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  let animFrame = null;
  function animate() {
    draw();
    animFrame = requestAnimationFrame(animate);
  }

  function tick() {
    if (paused || gameOver || !running) return;

    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
      endGame(); return;
    }

    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame(); return;
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      updateScore();
      food = randomFood();
      if (!food) { endGame(true); return; }
      speed = Math.max(60, 150 - score * 3);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    } else {
      snake.pop();
    }

    draw();
  }

  function updateScore() {
    scoreEl.textContent = score;
    bestScoreEl.textContent = bestScore;
  }

  function endGame(win = false) {
    if (gameOver) return;
    gameOver = true;
    running = false;
    clearInterval(gameLoop);
    gameLoop = null;
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }

    if (score > bestScore) {
      bestScore = score;
      saveBest(bestScore);
      updateScore();
    }

    overlayTitle.textContent = win ? '🎉 你赢了！' : '💀 游戏结束';
    overlayScore.textContent = `得分：${score}  ·  最高：${bestScore}`;
    playBtn.textContent = '🔄 再来一局';
    overlay.classList.add('show');
    draw();
  }

  function startGame() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    overlay.classList.remove('show');
    pauseBadge.classList.remove('show');
    init();
    running = true;
    paused = false;
    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(tick, speed);
    animate();
  }

  function togglePause() {
    if (gameOver || !running) return;
    paused = !paused;
    pauseBadge.classList.toggle('show', paused);
  }

  // --- Input ---
  function setDir(dx, dy) {
    if (gameOver || !running) return;
    if (dir.x + dx === 0 && dir.y + dy === 0) return;
    nextDir = { x: dx, y: dy };
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (key === ' ' || key === 'Space') { e.preventDefault(); togglePause(); return; }
    if (paused) return;
    switch (key) {
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1, 0); break;
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (paused) return;
    const t = e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { togglePause(); return; }
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  canvas.addEventListener('click', () => {
    if (gameOver) { startGame(); }
    else if (running) { togglePause(); }
  });

  playBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  init();
  overlay.classList.add('show');
  overlayTitle.textContent = '🐍 贪吃蛇';
  overlayScore.textContent = '';
  playBtn.textContent = '开始游戏';
  draw();

  setInterval(draw, 50); // keep food pulse animation
})();
</script>
</body>
</html>
